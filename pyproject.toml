[project]
name = "agentcreationkit"
version = "0.2.0"
description = "Tools that let AI coding agents build Bethesda game mods: unattended xEdit runs, Creation Kit automation, plugin checks, Papyrus, BA2, Mod Organizer 2"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "IronAdamant"}]
dependencies = []

[project.scripts]
ack = "ack.__main__:main"

[tool.setuptools.packages.find]
include = ["ack*"]

[tool.setuptools.package-data]
"ack.xedit" = ["rules.json", "scripts/*.pas"]
